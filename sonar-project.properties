# SonarCloud configuration
# Organization and projectKey are set via GitHub Actions repository variables:
#   SONAR_ORGANIZATION, SONAR_PROJECT_KEY
# You can override them locally by uncommenting and setting the following:
# sonar.organization=
# sonar.projectKey=

sonar.projectName=football-api
sonar.sourceEncoding=UTF-8

# Sources and tests
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.source=21

# Test reports and coverage
sonar.junit.reportPaths=build/test-results/test
sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml

# Optional exclusions to align with coverage rules in build.gradle
sonar.exclusions=**/config/**,**/security/**,**/FootballApiApplication.java
