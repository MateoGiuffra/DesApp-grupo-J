spring.datasource.url=jdbc:h2:mem:football-api;DB_CLOSE_DELAY=-1;MODE=MYSQL
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
# Logging configuration
logging.level.root=INFO
logging.level.com.desapp.football_api=INFO
spring.output.ansi.enabled=ALWAYS
spring.sql.init.mode=always
# cache configuration
spring.cache.type=caffeine
spring.cache.cache-names=serviceCache
spring.cache.caffeine.spec=expireAfterWrite=15s,maximumSize=500