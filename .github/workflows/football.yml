name: Run Tests on PR

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      h2:
        image: oscarfonts/h2
        ports:
          - 1521:1521
        env:
          H2_OPTIONS: "-tcp -tcpAllowOthers -tcpPort 1521 -user root -password root"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run tests
        run: ./gradlew test
        env:
          SPRING_DATASOURCE_URL: jdbc:h2:tcp://localhost:1521/~/test
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
