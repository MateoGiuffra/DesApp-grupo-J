plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    id 'org.sonarqube' version '4.4.1.3373'
}

group = 'com.desapp'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

jacoco {
    toolVersion = "0.8.12"
}

// Reports for unit tests (tagged as 'unit')
jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
    // Exclude non-critical packages/classes from coverage
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    'com/desapp/football_api/FootballApiApplication.class',
                    'com/desapp/football_api/config/**',
                    'com/desapp/football_api/security/**'
            ])
        }))
    }
}

jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'INSTRUCTION'
                value = 'COVEREDRATIO'
                minimum = 0.65
            }
        }
    }
    // Mirror exclusions used in the report
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    'com/desapp/football_api/FootballApiApplication.class',
                    'com/desapp/football_api/config/**',
                    'com/desapp/football_api/security/**'
            ])
        }))
    }
}

check.dependsOn jacocoTestCoverageVerification

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Caffeine
    implementation 'com.github.ben-manes.caffeine:caffeine'

    // Si estás usando Spring Boot, también se recomienda añadir el soporte
    // para Caching de Spring Context, aunque a veces ya está implícito:
    implementation 'org.springframework.boot:spring-boot-starter-cache'

    // thymeleaf
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // jsoup
    implementation 'org.jsoup:jsoup:1.16.1'

    // swagger (para documentación OpenAPI con Spring MVC)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    // H2 Database (en memoria para dev/test)
    runtimeOnly 'com.h2database:h2'
    // H2 Database (para dev/test, incluye Server)
    implementation 'com.h2database:h2:2.2.224'


    // MySQL connector (para base de datos externa)
    implementation 'mysql:mysql-connector-java:8.0.33'

    // JPA ORM
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Spring MVC (para @RestController, API REST)
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // lombok (getter, setter etc)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // jwt
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // dev tools
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // spring boot core
    implementation 'org.springframework.boot:spring-boot-starter'

    // tests
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.junit.platform:junit-platform-suite:1.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-suite-engine:1.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Unit tests: only run tests tagged as 'unit'
tasks.named('test') {
    useJUnitPlatform {
        includeTags 'unit'
    }
    finalizedBy 'jacocoTestReport'
}

// Integration tests: run tests tagged as 'integration'
tasks.register('integrationTest', Test) {
    description = 'Runs integration tests'
    group = 'verification'
    useJUnitPlatform {
        includeTags 'integration'
    }
    // Exclude the unit test suite aggregator from integration runs to avoid NoTestsDiscovered
    filter {
        excludeTestsMatching 'com.desapp.football_api.unit.*'
    }
    testLogging {
        events "passed", "failed", "skipped"
    }
}
