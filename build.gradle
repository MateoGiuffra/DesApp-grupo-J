plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    id 'org.sonarqube' version '4.4.1.3373'
}

group = 'com.desapp'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
jacocoTestReport {
    reports {
        xml.required = true
    }
}
configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // thymeleaf
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // jsoup
    implementation 'org.jsoup:jsoup:1.16.1'

    // swagger (para documentación OpenAPI con Spring MVC)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    // H2 Database (en memoria para dev/test)
    runtimeOnly 'com.h2database:h2'
    // H2 Database (para dev/test, incluye Server)
    implementation 'com.h2database:h2:2.2.224'


    // MySQL connector (para base de datos externa)
    implementation 'mysql:mysql-connector-java:8.0.33'

    // JPA ORM
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Spring MVC (para @RestController, API REST)
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // lombok (getter, setter etc)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // jwt
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // dev tools
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // spring boot core
    implementation 'org.springframework.boot:spring-boot-starter'

    // tests
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
